    <!-- Barcode section removed -->
    <section id="contact">
        <h2>Get in Touch</h2>
        <form id="contact-form" onsubmit="sendEmail(event)">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Your name" autocomplete="name" required aria-required="true">

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="you@company.com" autocomplete="email" required aria-required="true">

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="6" placeholder="Role or team, what you&rsquo;d like to discuss, and timing" required aria-required="true"></textarea>

            <input type="checkbox" name="botcheck" tabindex="-1" autocomplete="off" style="display:none">

            <button type="submit">Send Message</button>
            <p id="form-status" role="status" aria-live="polite"></p>
        </form>
    </section>
